<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Contact | ZIZOU DESIGN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="legal-body">

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="legal-nav">

        <a
            href="index.html"
            class="legal-back"
            aria-label="Back to homepage"
        >
            ←
        </a>

        <a
            href="index.html"
            class="legal-logo"
        >
            ZIZOU DESIGN
        </a>

        <div class="legal-nav-space"></div>

    </header>


    <!-- =========================
         CONTACT
    ========================== -->

    <main class="contact-page">

        <div class="contact-heading">

            <p class="legal-label">
                ZIZOU DESIGN
            </p>

            <h1>
                Contact
            </h1>

            <p class="contact-intro">
                FOR GENERAL INQUIRIES, ARTWORK,
                COMMISSIONS, LICENSING, PRESS,
                AND COLLABORATIONS.
            </p>

        </div>


        <!-- =========================
             CONTACT FORM
        ========================== -->

        <form
            class="contact-form"
            id="contactForm"
        >

            <div class="contact-field">

                <label for="name">
                    NAME
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="contact-field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="contact-field">

                <label for="inquiry">
                    INQUIRY
                </label>

                <select
                    id="inquiry"
                    name="inquiry"
                    required
                >

                    <option value="" disabled selected>
                        SELECT
                    </option>

                    <option value="general">
                        General Inquiry
                    </option>

                    <option value="artwork">
                        Artwork
                    </option>

                    <option value="commission">
                        Commission
                    </option>

                    <option value="licensing">
                        Licensing
                    </option>

                    <option value="collaboration">
                        Collaboration
                    </option>

                    <option value="press">
                        Press
                    </option>

                    <option value="order">
                        Order Support
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="contact-field">

                <label for="message">
                    MESSAGE
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="contact-submit"
            >
                SEND INQUIRY
            </button>

        </form>


        <!-- =========================
             DIRECT CONTACT
        ========================== -->

        <div class="contact-direct">

            <p>
                DIRECT CONTACT
            </p>

            <p class="contact-email">
                CONTACT EMAIL COMING SOON
            </p>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>© ZIZOU DESIGN</p>

        <div class="footer-links">

            <a href="terms.html">Terms & Conditions</a>
            <span>·</span>

            <a href="privacy.html">Privacy Policy</a>
            <span>·</span>

            <a href="license.html">Digital License</a>
            <span>·</span>

            <a href="refund.html">Refund Policy</a>
            <span>·</span>

            <a href="contact.html">Contact</a>

        </div>

    </footer>

</body>
</html>
