<!-- =========================
     LIVE CHAT
========================== -->

<script>

const liveSupportSection =
    document.getElementById(
        "liveSupportSection"
    );

const startLiveChat =
    document.getElementById(
        "startLiveChat"
    );

const liveChatStatus =
    document.getElementById(
        "liveChatStatus"
    );

const supportDock =
    document.getElementById(
        "supportDock"
    );


let tawkLoading = false;


/* =========================
   PAGE STATES
========================== */

function showStartSection() {

    liveSupportSection
        .classList
        .remove("hidden");

    supportDock
        .classList
        .remove("show");

}


function hideStartSection() {

    liveSupportSection
        .classList
        .add("hidden");

}


function showSupportDock() {

    hideStartSection();

    supportDock
        .classList
        .add("show");

}


function hideSupportDock() {

    supportDock
        .classList
        .remove("show");

}



/* =========================
   OPEN CHAT
========================== */

function openTawkChat() {

    hideStartSection();

    hideSupportDock();


    /*
       If Tawk is already loaded,
       reopen the existing conversation.
    */

    if (
        window.Tawk_API &&
        typeof window.Tawk_API.showWidget ===
            "function" &&
        typeof window.Tawk_API.maximize ===
            "function"
    ) {

        window.Tawk_API.showWidget();

        window.Tawk_API.maximize();

        return;

    }


    if (tawkLoading) {
        return;
    }


    tawkLoading = true;


    if (liveChatStatus) {

        liveChatStatus.textContent =
            "OPENING LIVE SUPPORT...";

    }


    window.Tawk_API =
        window.Tawk_API || {};


    window.Tawk_LoadStart =
        new Date();



    /* =========================
       WIDGET LOADED
    ========================== */

    window.Tawk_API.onLoad =
        function () {

            tawkLoading = false;


            if (liveChatStatus) {

                liveChatStatus.textContent =
                    "";

            }


            window.Tawk_API.showWidget();

            window.Tawk_API.maximize();

        };



    /* =========================
       CHAT STARTED
    ========================== */

    window.Tawk_API.onChatStarted =
        function () {

            hideStartSection();

            hideSupportDock();

        };



    /* =========================
       CHAT MAXIMIZED
    ========================== */

    window.Tawk_API.onChatMaximized =
        function () {

            hideStartSection();

            hideSupportDock();

        };



    /* =========================
       CHAT MINIMIZED
    ========================== */

    window.Tawk_API.onChatMinimized =
        function () {

            window.Tawk_API.hideWidget();

            showSupportDock();

        };



    /* =========================
       CHAT ENDED
    ========================== */

    window.Tawk_API.onChatEnded =
        function () {

            hideSupportDock();


            if (
                typeof window.Tawk_API.hideWidget ===
                    "function"
            ) {

                window.Tawk_API.hideWidget();

            }


            showStartSection();

        };



    /* =========================
       LOAD TAWK
    ========================== */

    const tawkScript =
        document.createElement(
            "script"
        );


    tawkScript.async =
        true;


    tawkScript.src =
        "https://embed.tawk.to/6a9f0a7ed0128c344982321b/1k1uk1vjc";


    tawkScript.charset =
        "UTF-8";


    tawkScript.setAttribute(
        "crossorigin",
        "*"
    );


    tawkScript.onerror =
        function () {

            tawkLoading = false;


            showStartSection();


            if (liveChatStatus) {

                liveChatStatus.textContent =
                    "LIVE SUPPORT COULD NOT BE LOADED. PLEASE TRY AGAIN.";

            }

        };


    document.body.appendChild(
        tawkScript
    );

}



/* =========================
   START LIVE CHAT
========================== */

startLiveChat.addEventListener(
    "click",
    openTawkChat
);



/* =========================
   MINIMIZED SUPPORT BAR
========================== */

supportDock.addEventListener(
    "click",
    function () {

        hideSupportDock();


        if (
            window.Tawk_API &&
            typeof window.Tawk_API.showWidget ===
                "function"
        ) {

            window.Tawk_API.showWidget();

        }


        if (
            window.Tawk_API &&
            typeof window.Tawk_API.maximize ===
                "function"
        ) {

            window.Tawk_API.maximize();

        }

    }
);

</script>
