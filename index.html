<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZOU DESIGN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- =========================
         SIDE MENU
    ========================== -->

    <aside class="side-menu" id="sideMenu">

        <button
            class="close-menu"
            id="closeMenu"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>


        <nav class="menu-nav">

            <a href="index.html">
                Home
            </a>


            <!-- COLLECTIONS DROPDOWN -->

            <div class="menu-dropdown">

                <button
                    class="dropdown-button"
                    id="collectionsButton"
                    type="button"
                >
                    Collections
                    <span>⌄</span>
                </button>


                <div
                    class="dropdown-content"
                    id="collectionsMenu"
                >

                    <a href="summertide.html">
                        Summertide Collection
                    </a>

                </div>

            </div>


            <a href="#about">
                About
            </a>


            <a href="#contact">
                Contact
            </a>

        </nav>

    </aside>



    <!-- =========================
         FULL SCREEN HERO
    ========================== -->

    <section class="hero" id="home">

        <img
            src="images/IMG_2075.jpeg"
            alt="ZIZOU DESIGN"
            class="hero-image"
        >


        <!-- Navigation -->

        <header class="navbar">

            <div class="nav-left">

                <button
                    class="icon-button menu-button"
                    id="menuButton"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>


                <button
                    class="icon-button search-button"
                    id="searchButton"
                    type="button"
                    aria-label="Search"
                >
                    ⌕
                </button>

            </div>


            <a href="#home" class="logo">
                ZIZOU DESIGN
            </a>


            <div class="nav-right">

                <button
                    class="bag-button"
                    type="button"
                    aria-label="Shopping bag"
                >
                    ♧
                </button>

            </div>

        </header>



        <!-- Hero Collection Button -->

        <a
            href="#collection"
            class="collection-button"
        >
            VIEW COLLECTION
        </a>

    </section>



    <!-- =========================
         LATEST COLLECTION
    ========================== -->

    <main
        class="collection"
        id="collection"
    >

        <p class="collection-brand">
            LATEST COLLECTION
        </p>


        <h1>
            Summertide
        </h1>



        <!-- FOUR CLEAN HOMEPAGE PREVIEWS -->

        <div class="collection-grid">


            <!-- AMBER BREEZE -->

            <a
                href="amber-breeze.html"
                class="artwork-link"
                aria-label="View Amber Breeze"
            >
                <img
                    src="images/amber breeze home page.jpg"
                    alt="Amber Breeze"
                >
            </a>



            <!-- PERIDOT AFLOAT -->

            <a
                href="peridot-afloat.html"
                class="artwork-link"
                aria-label="View Peridot Afloat"
            >
                <img
                    src="images/peridot afloat home page.jpg"
                    alt="Peridot Afloat"
                >
            </a>



            <!-- PATINA DEL MAR -->

            <a
                href="patina-del-mar.html"
                class="artwork-link"
                aria-label="View Pátina del Mar"
            >
                <img
                    src="images/pátina del mar home page.jpg"
                    alt="Pátina del Mar"
                >
            </a>



            <!-- SAGE QUIETUDE -->

            <a
                href="sage-quietude.html"
                class="artwork-link"
                aria-label="View Sage Quietude"
            >
                <img
                    src="images/sage quietude home page.jpg"
                    alt="Sage Quietude"
                >
            </a>


        </div>



        <!-- VIEW FULL COLLECTION -->

        <div class="view-more">

            <a href="summertide.html">
                VIEW FULL COLLECTION
            </a>

        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>
</html>
