<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZIZOU DESIGN</title>

    <link
        rel="stylesheet"
        href="style.css?v=7"
    >


    <!-- =========================================
         COLLECTION MENU FIX
    ========================================== -->

    <style>

        .dropdown-content {
            list-style: none !important;
        }

        .dropdown-content::before,
        .dropdown-content::after,
        .dropdown-content a::before,
        .dropdown-content a::after {
            content: none !important;
            display: none !important;
        }

        .dropdown-content a {
            display: block;
        }

        .dropdown-content a + a {
            margin-top: 8px;
        }

    </style>

</head>


<body>


<!-- =========================================
     SIDE MENU
========================================= -->

<aside
    class="side-menu"
    id="sideMenu"
>

    <button
        class="close-menu"
        id="closeMenu"
        type="button"
        aria-label="Close menu"
    >
        ×
    </button>


    <nav class="menu-nav">

        <a href="index.html">
            Home
        </a>


        <div class="menu-dropdown">

            <button
                class="dropdown-button"
                id="collectionsButton"
                type="button"
            >
                Collections

                <span>
                    ⌄
                </span>
            </button>


            <div
                class="dropdown-content"
                id="collectionsMenu"
            >

                <a href="summertide.html">
                    Summertide Collection
                </a>

                <a href="sea-of-sees.html">
                    Sea of Sees
                </a>

            </div>

        </div>


        <a href="about.html">
            About
        </a>


        <a
            href="contact.html"
            id="contactMenuLink"
        >
            Contact
        </a>

    </nav>

</aside>



<!-- =========================================
     FULL SCREEN HERO
========================================= -->

<section
    class="hero"
    id="home"
>

    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >

        <source
            src="videos/zizou home video.mp4"
            type="video/mp4"
        >

    </video>



    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="navbar">


        <div class="nav-left">

            <button
                class="icon-button menu-button"
                id="menuButton"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>


            <button
                class="icon-button search-button"
                id="searchButton"
                type="button"
                aria-label="Search"
            >
                ⌕
            </button>

        </div>



        <a
            href="#home"
            class="logo"
        >
            ZIZOU DESIGN
        </a>



        <div class="nav-right">

            <button
                class="bag-button"
                id="bagButton"
                type="button"
                aria-label="Shopping bag"
            >

                <img
                    src="images/ZIZOU LOGO.PNG"
                    alt=""
                    class="bag-logo"
                >

                <span id="bagCount">
                    0
                </span>

            </button>

        </div>


    </header>



    <!-- =========================================
         HERO COLLECTION BUTTON
    ========================================== -->

    <a
        href="#collection"
        class="collection-button"
    >
        VIEW COLLECTION
    </a>


</section>



<!-- =========================================
     SHOPPING BAG
========================================= -->

<div
    class="shopping-bag"
    id="shoppingBag"
>

    <div class="shopping-bag-header">

        <h2>
            YOUR BAG
        </h2>


        <button
            id="closeBag"
            type="button"
            aria-label="Close shopping bag"
        >
            ×
        </button>

    </div>


    <div id="bagItems"></div>


    <div
        class="bag-empty"
        id="bagEmpty"
    >
        YOUR BAG IS EMPTY
    </div>


    <div
        class="bag-checkout-area"
        id="bagCheckoutArea"
    >

        <a
            href="https://zizoudesign.lemonsqueezy.com/checkout/buy/8c922568-b22d-4f21-b7cb-9faaf3298379?embed=1&logo=0"
            class="lemonsqueezy-button checkout-button"
            id="checkoutButton"
        >
            CHECKOUT
        </a>

    </div>

</div>



<!-- =========================================
     LATEST COLLECTION
========================================= -->

<main
    class="collection"
    id="collection"
>

    <p class="collection-brand">
        LATEST COLLECTION
    </p>


    <h1>
        Summertide
    </h1>



    <!-- =========================================
         FOUR HOMEPAGE PREVIEWS
    ========================================== -->

    <div class="collection-grid">


        <!-- AMBER BREEZE -->

        <div class="artwork-link">

            <div
                class="protected-home-image"
                role="img"
                aria-label="Amber Breeze"
                style="
                    background-image:
                    url('images/amber breeze home page.jpg');
                "
            ></div>

        </div>



        <!-- PERIDOT AFLOAT -->

        <div class="artwork-link">

            <div
                class="protected-home-image"
                role="img"
                aria-label="Peridot Afloat"
                style="
                    background-image:
                    url('images/peridot afloat home page.jpg');
                "
            ></div>

        </div>



        <!-- PÁTINA DEL MAR -->

        <div class="artwork-link">

            <div
                class="protected-home-image"
                role="img"
                aria-label="Pátina del Mar"
                style="
                    background-image:
                    url('images/patina del mar home page.jpg');
                "
            ></div>

        </div>



        <!-- SAGE QUIETUDE -->

        <div class="artwork-link">

            <div
                class="protected-home-image"
                role="img"
                aria-label="Sage Quietude"
                style="
                    background-image:
                    url('images/sage quietude home page.jpg');
                "
            ></div>

        </div>


    </div>



    <!-- =========================================
         VIEW FULL COLLECTION
    ========================================== -->

    <div class="view-more">

        <a href="summertide.html">
            VIEW FULL COLLECTION
        </a>

    </div>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="site-footer">

    <p>
        © ZIZOU DESIGN
    </p>


    <div class="footer-links">

        <a href="terms.html">
            Terms & Conditions
        </a>

        <span>·</span>


        <a href="privacy.html">
            Privacy Policy
        </a>

        <span>·</span>


        <a href="license.html">
            Digital License
        </a>

        <span>·</span>


        <a href="refund.html">
            Refund Policy
        </a>

        <span>·</span>


        <a href="contact.html">
            Contact
        </a>

    </div>

</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js?v=3"></script>

<script src="cart.js?v=4"></script>

<script
    src="https://assets.lemonsqueezy.com/lemon.js"
    defer
></script>


</body>

</html>
