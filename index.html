<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIZOU DESIGN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FULL SCREEN HERO -->
    <section class="hero" id="home">

        <img
            src="images/IMG_2075.jpeg"
            alt="ZIZOU DESIGN"
            class="hero-image"
        >

        <!-- Navigation -->
        <header class="navbar">

            <div class="nav-left">
                <button class="icon-button menu-button" aria-label="Menu">
                    ☰
                </button>

                <button class="icon-button search-button" aria-label="Search">
                    ⌕
                </button>
            </div>

            <a href="#home" class="logo">
                ZIZOU DESIGN
            </a>

            <div class="nav-right">
                <button class="bag-button" aria-label="Shopping bag">
                    ♧
                </button>
            </div>

        </header>


        <!-- Collection button -->
        <a href="#collection" class="collection-button">
            VIEW COLLECTION
        </a>

    </section>


    <!-- COLLECTION -->
    <main class="collection" id="collection">

        <p class="collection-brand">ZIZOU DESIGN</p>

        <h1>Current Collection</h1>

        <div class="collection-grid">

            <article class="artwork">
                <img src="images/amber-breeze.jpeg" alt="Amber Breeze">

                <h2>Amber Breeze</h2>
                <p>$39.00</p>
            </article>


            <article class="artwork">
                <img src="images/sage-quietude.jpeg" alt="Sage Quietude">

                <h2>Sage Quietude</h2>
                <p>$39.00</p>
            </article>


            <article class="artwork">
                <img src="images/eter-do-luar.jpeg" alt="Éter do Luar">

                <h2>Éter do Luar</h2>
                <p>$39.00</p>
            </article>


            <article class="artwork">
                <img src="images/oneiric-glow.jpeg" alt="Oneiric Glow">

                <h2>Oneiric Glow</h2>
                <p>$39.00</p>
            </article>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
