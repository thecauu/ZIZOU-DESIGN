<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZIZOU DESIGN</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <div class="nav-left">
      <button class="nav-icon" id="menuButton" aria-label="Open menu">
        ☰
      </button>

      <button class="nav-icon search-icon" id="searchButton" aria-label="Search">
        ⌕
      </button>
    </div>

    <a href="#" class="logo">
      ZIZOU DESIGN
    </a>

    <div class="nav-right">
      <button class="nav-icon" aria-label="Wishlist">
        ♡
      </button>

      <button class="nav-icon" aria-label="Shopping bag">
        ♧
      </button>
    </div>

  </header>


  <aside class="side-menu" id="sideMenu">

    <button class="close-button" id="closeMenu">
      ×
    </button>

    <nav>
      <a href="#">Home</a>
      <a href="#collection">Collection</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

  </aside>


  <div class="search-screen" id="searchScreen">

    <button class="search-close" id="closeSearch">
      ×
    </button>

    <div class="search-box">
      <input
        type="search"
        placeholder="Search ZIZOU DESIGN"
        aria-label="Search ZIZOU DESIGN"
      >
    </div>

  </div>


  <main>

    <section class="hero">

      <img
        src="images/zizou-hero.jpg"
        alt="ZIZOU DESIGN campaign"
        class="hero-image"
      >

      <div class="hero-shade"></div>

      <div class="hero-content">

        <a href="#collection" class="hero-button">
          VIEW COLLECTION
        </a>

      </div>

    </section>


    <section class="collection" id="collection">

      <div class="section-heading">
        <p>ZIZOU DESIGN</p>
        <h2>Current Collection</h2>
      </div>

      <div class="product-grid">

        <article class="product">
          <img src="images/product-1.jpg" alt="ZIZOU DESIGN product">
          <div class="product-info">
            <h3>Product Name</h3>
            <p>$00.00</p>
          </div>
        </article>

        <article class="product">
          <img src="images/product-2.jpg" alt="ZIZOU DESIGN product">
          <div class="product-info">
            <h3>Product Name</h3>
            <p>$00.00</p>
          </div>
        </article>

        <article class="product">
          <img src="images/product-3.jpg" alt="ZIZOU DESIGN product">
          <div class="product-info">
            <h3>Product Name</h3>
            <p>$00.00</p>
          </div>
        </article>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
