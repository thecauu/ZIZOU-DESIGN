<!-- =========================================
     SEA OF SEES — INTRO ANIMATION
========================================= -->

<script>

const seaIntro =
    document.getElementById(
        "seaIntro"
    );

const seaIntroImage =
    document.querySelector(
        ".sea-intro-image"
    );

const themeColor =
    document.getElementById(
        "themeColor"
    );


if (
    seaIntro &&
    seaIntroImage
) {

    document.body.classList.add(
        "sea-intro-active"
    );


    if (themeColor) {

        themeColor.setAttribute(
            "content",
            "#000000"
        );

    }


    window.addEventListener(
        "load",
        function () {


            /* COVER ENTERS */

            window.setTimeout(
                function () {

                    seaIntro.classList.add(
                        "is-visible"
                    );

                },
                250
            );


            /* COVER EXITS */

            window.setTimeout(
                function () {

                    seaIntro.classList.add(
                        "is-leaving"
                    );

                },
                3500
            );


            /* INTRO REMOVED */

            window.setTimeout(
                function () {

                    document.body.classList.remove(
                        "sea-intro-active"
                    );


                    if (themeColor) {

                        themeColor.setAttribute(
                            "content",
                            "#f7f6f3"
                        );

                    }


                    seaIntro.remove();

                },
                5400
            );

        }
    );

}

</script>
