<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

<body>

<div class="summertide-background"></div>

    <!-- =========================
         TOP NAV
    ========================== -->

    <header class="collection-page-nav">

        <a href="index.html" class="back-link" aria-label="Back to homepage">
            ←

    ========================== -->

    <main class="collection-page">

            COLLECTION
        </p>

        <h1>
            Summertide
        </h1>



        <div class="full-collection-grid">


    <!-- 01 — AMBER BREEZE -->

    <div class="collection-product">

        <button
            class="collection-item"
            type="button"
            data-gallery="amber"
        >
            <img
                src="images/amber breeze second page.jpg"
                alt="Amber Breeze"
            >
        </button>

        <div class="product-info">
            <p class="product-title">Amber Breeze</p>
            <p class="product-price">$19.99 USD</p>

            <button
                class="add-to-bag"
                type="button"
                data-product="amber-breeze"
                data-name="Amber Breeze"
                data-price="19.99"
            >
                ADD TO BAG
            </button>
        </div>

    </div>

</div>

    </main>



    <!-- =========================
         LIGHTBOX / SLIDER
    ========================== -->

    <div
        class="lightbox"
        id="lightbox"
        aria-hidden="true"
    >

        <button
            class="lightbox-close"
            id="lightboxClose"
            type="button"
            aria-label="Close gallery"
        >
            ×
        </button>


        <button
            class="lightbox-arrow lightbox-prev"
            id="lightboxPrev"
            type="button"
            aria-label="Previous image"
        >
            ‹
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >

            <p
                id="lightboxTitle"
                class="lightbox-title"
            ></p>

            <p
                id="lightboxCounter"
                class="lightbox-counter"
            ></p>

        </div>


        <button
            class="lightbox-arrow lightbox-next"
            id="lightboxNext"
            type="button"
            aria-label="Next image"
        >
            ›
        </button>

    </div>
